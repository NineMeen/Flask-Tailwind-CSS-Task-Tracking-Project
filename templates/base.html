<!DOCTYPE html  >
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <title>WorkTracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="drawer lg:drawer-open">
    <!-- Drawer toggle for mobile -->
    <input id="my-drawer" type="checkbox" class="drawer-toggle" />
    
    <!-- Page content -->
    <div class="drawer-content flex flex-col">
      <!-- Navbar -->
      <div class="w-full navbar bg-[#2e2b2e]">
        <div class="flex-none lg:hidden">
          <label for="my-drawer" class="btn btn-square btn-ghost">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-6 h-6 stroke-current">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </label>
        </div>
        <div class="flex-1 px-2 mx-2 text-white">Task Tracker</div>
        <div class="flex-none">
<!-- Update the notification bell section -->
<div class="flex-none">
  <div class="dropdown dropdown-end">
      <button class="btn btn-ghost btn-circle" onclick="toggleNotifications()">
          <div class="indicator">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="white">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
              </svg>
              <span id="notification-badge" class="badge badge-xs badge-primary indicator-item hidden">0</span>
          </div>
      </button>
      <div id="notifications-dropdown" class="dropdown-content menu p-2 shadow bg-base-100 rounded-box w-80 hidden">
          <div class="flex justify-between items-center p-2 border-b">
              <span class="font-semibold">Notifications</span>
              <button onclick="clearAllNotifications()" class="text-sm text-gray-500 hover:text-gray-700">
                  Clear all
              </button>
          </div>
          <div id="notifications-list" class="max-h-96 overflow-y-auto">
              <!-- Notifications will be inserted here -->
          </div>
      </div>
  </div>
</div>
          <div class="flex items-center">
            <span class="text-white mr-4">{{ current_user.username }} ({{ current_user.team.name }})</span>
          </div>
          <div class="dropdown dropdown-end">
            <label tabindex="0" class="btn btn-ghost btn-circle avatar">
              <div class="w-10 rounded-full">
                <img src="https://ui-avatars.com/api/?name=User" />
              </div>
            </label>
            <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow bg-base-100 rounded-box w-52">
              <li><a href="{{ url_for('logout') }}">Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
      
      <!-- Main content -->
      <div class="p-4">
        {% block content %}
        {% endblock %}
      </div>
    </div>
    
    <!-- Sidebar -->
    <div class="drawer-side">
      <label for="my-drawer" class="drawer-overlay"></label>
      <ul class="menu p-4 w-80 h-full  bg-[#282528] text-base-content">
        <li class="mb-2 font-semibold text-xl text-white">Task Tracker</li>
        <li class="mb-[20px]">
          <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %} text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            Tasks
          </a>
        </li>
        <li class="mb-[20px]">
          <a href="{{ url_for('search') }}" class="{% if request.endpoint == 'search' %}active{% endif %} text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 30 30" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M 13 3 C 7.4889971 3 3 7.4889971 3 13 C 3 18.511003 7.4889971 23 13 23 C 15.396508 23 17.597385 22.148986 19.322266 20.736328 L 25.292969 26.707031 A 1.0001 1.0001 0 1 0 26.707031 25.292969 L 20.736328 19.322266 C 22.148986 17.597385 23 15.396508 23 13 C 23 7.4889971 18.511003 3 13 3 z M 13 5 C 17.430123 5 21 8.5698774 21 13 C 21 17.430123 17.430123 21 13 21 C 8.5698774 21 5 17.430123 5 13 C 5 8.5698774 8.5698774 5 13 5 z" />
            </svg>
            Search
          </a>
        </li>
        <li class="mb-[20px]">
          <a href="{{ url_for('team_page') }}" class="{% if request.endpoint == 'teams' %}active{% endif %} text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            Teams
          </a>
        </li>
        <li class="mb-[20px]">
            <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %} text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
                Dashboard
            </a>
        </li>
        <div class="divider"></div>
        {% if current_user.is_admin %}
        <li class="mb-[20px]">
            <details>
              <summary class="text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Settings
              </summary>
              <ul>
                <li>
                    <a href="{{ url_for('user_manage') }}" class="text-white {% if request.endpoint == 'user_manage' %}active{% endif %}">
                        User Management
                    </a>
                </li>
              </ul>
            </details>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
  <script>
    let socket = io();
    let unreadCount = 0;

    // Connect to Socket.IO
    socket.on('connect', function() {
        if ("{{ current_user.team.name }}" === "SA") {
            socket.emit('join', {room: 'sa_team'});
        }
    });

    // Handle new notifications
    socket.on('new_notification', function(data) {
        unreadCount++;
        updateNotificationBadge();
        addNotification(data);
    });

    // Load existing notifications
    function loadNotifications() {
        fetch('/notifications')
            .then(response => response.json())
            .then(notifications => {
                unreadCount = notifications.length;
                updateNotificationBadge();
                const notificationsList = document.getElementById('notifications-list');
                notificationsList.innerHTML = '';
                notifications.forEach(addNotification);
            });
    }

    function addNotification(notification) {
        const notificationsList = document.getElementById('notifications-list');
        const notificationElement = document.createElement('div');
        notificationElement.className = 'p-2 hover:bg-base-200 rounded cursor-pointer relative group';
        notificationElement.id = `notification-${notification.id}`;
        notificationElement.innerHTML = `
            <div class="flex justify-between items-start">
                <a href="/migration/${notification.migration_id}" class="text-sm flex-grow">
                    ${notification.message}
                </a>
                <button onclick="closeNotification(event, ${notification.id})" 
                        class="text-gray-400 hover:text-gray-600 ml-2 opacity-0 group-hover:opacity-100 transition-opacity">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="text-xs text-gray-500">${notification.created_at || new Date().toLocaleString()}</div>
        `;
        notificationsList.prepend(notificationElement);
    }

    function closeNotification(event, notificationId) {
        event.preventDefault();
        event.stopPropagation();
        
        fetch(`/notifications/mark-read/${notificationId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const notification = document.getElementById(`notification-${notificationId}`);
                if (notification) {
                    notification.remove();
                    unreadCount--;
                    updateNotificationBadge();
                }
                
                // Hide dropdown if no notifications
                const notificationsList = document.getElementById('notifications-list');
                if (notificationsList.children.length === 0) {
                    document.getElementById('notifications-dropdown').classList.add('hidden');
                }
            }
        });
    }

    function clearAllNotifications() {
        fetch('/notifications/mark-all-read', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const notificationsList = document.getElementById('notifications-list');
                notificationsList.innerHTML = '';
                unreadCount = 0;
                updateNotificationBadge();
                document.getElementById('notifications-dropdown').classList.add('hidden');
            }
        });
    }

    function updateNotificationBadge() {
        const badge = document.getElementById('notification-badge');
        if (unreadCount > 0) {
            badge.textContent = unreadCount;
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
    }

    function toggleNotifications() {
        const dropdown = document.getElementById('notifications-dropdown');
        dropdown.classList.toggle('hidden');
        if (!dropdown.classList.contains('hidden')) {
            loadNotifications();
        }
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', loadNotifications);

    document.addEventListener('DOMContentLoaded', function() {
        // Connect to Socket.IO server
        const socket = io();
        
        // Handle new notifications
        socket.on('new_notification', function(data) {
            // Update notification count
            const countElement = document.getElementById('notification-count');
            if (countElement) {
                const currentCount = parseInt(countElement.textContent || '0');
                countElement.textContent = currentCount + 1;
            }
            
            // Add new notification to list if it exists
            const notificationList = document.getElementById('notification-list');
            if (notificationList) {
                const newNotification = document.createElement('div');
                newNotification.className = 'notification-item';
                newNotification.innerHTML = `
                    <a href="/migration/${data.migration_id}" class="block px-4 py-2 hover:bg-gray-100">
                        <p class="text-sm text-gray-700">${data.message}</p>
                        <p class="text-xs text-gray-500">${data.created_at}</p>
                    </a>
                `;
                notificationList.insertBefore(newNotification, notificationList.firstChild);
            }
            
            // Show notification toast
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-white shadow-lg rounded-lg p-4 mb-4 border-l-4 border-blue-500';
            toast.innerHTML = `
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-blue-500" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/>
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-gray-900">${data.message}</p>
                    </div>
                </div>
            `;
            document.body.appendChild(toast);
            
            // Remove toast after 5 seconds
            setTimeout(() => {
                toast.remove();
            }, 5000);
        });
        
        // Handle connection error
        socket.on('connect_error', function(error) {
            console.error('Socket.IO connection error:', error);
        });
    });
  </script>
</body>
</html>
