{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-8">

    <!-- Search and Filter -->
    <div class="mb-6 flex gap-4">
        <input type="text" id="searchInput" placeholder="Search users..." 
               class="input input-bordered w-full max-w-xs" 
               oninput="filterTable()">
        <select id="teamFilter" class="select select-bordered" onchange="filterTable()">
            <option value="">All Teams</option>
            {% for team in teams %}
            <option value="{{ team.name }}">{{ team.name }}</option>
            {% endfor %}
        </select>
        <select id="statusFilter" class="select select-bordered" onchange="filterTable()">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
        </select>
    </div>

    <!-- Users Table -->
    <div class="overflow-x-auto">
        <table class="table w-full">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Team</th>
                    <th>Admin</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr class="user-row" 
                    data-username="{{ user.username }}" 
                    data-team="{{ user.team.name }}"
                    data-status="{{ 'active' if user.is_active else 'inactive' }}">
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                        <select class="select select-bordered w-full max-w-xs" 
                                onchange="updateUser({{ user.id }}, 'update_team', this.value)">
                            {% for team in teams %}
                            <option value="{{ team.id }}" {% if team.id == user.team_id %}selected{% endif %}>
                                {{ team.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </td>
                    <td>
                        <input type="checkbox" class="toggle" 
                               {% if user.is_admin %}checked{% endif %}
                               onchange="updateUser({{ user.id }}, 'toggle_admin')"
                               {% if user.id == current_user.id %}disabled{% endif %}>
                    </td>
                    <td>
                        <input type="checkbox" class="toggle" 
                               {% if user.is_active %}checked{% endif %}
                               onchange="updateUser({{ user.id }}, 'toggle_active')"
                               {% if user.id == current_user.id %}disabled{% endif %}>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-error" 
                                onclick="deleteUser({{ user.id }})"
                                {% if user.id == current_user.id %}disabled{% endif %}>
                            Delete
                        </button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Confirmation Modal -->
<dialog id="confirmModal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg">Confirm Action</h3>
        <p id="confirmMessage" class="py-4"></p>
        <div class="modal-action">
            <button id="confirmButton" class="btn btn-primary">Confirm</button>
            <button class="btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>
</dialog>

<script>
function filterTable() {
    const searchText = document.getElementById('searchInput').value.toLowerCase();
    const teamFilter = document.getElementById('teamFilter').value;
    const statusFilter = document.getElementById('statusFilter').value;
    
    document.querySelectorAll('.user-row').forEach(row => {
        const username = row.getAttribute('data-username').toLowerCase();
        const team = row.getAttribute('data-team');
        const status = row.getAttribute('data-status');
        
        const matchesSearch = username.includes(searchText);
        const matchesTeam = !teamFilter || team === teamFilter;
        const matchesStatus = !statusFilter || status === statusFilter;
        
        row.style.display = matchesSearch && matchesTeam && matchesStatus ? '' : 'none';
    });
}

function updateUser(userId, action, value = null) {
    const formData = new FormData();
    formData.append('action', action);
    if (value) {
        formData.append('team_id', value);
    }

    fetch(`/admin/user/${userId}/update`, {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            // Optional: Show success message
        } else {
            alert('Error updating user: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error updating user');
    });
}

function deleteUser(userId) {
    if (!confirm('Are you sure you want to delete this user?')) {
        return;
    }

    fetch(`/admin/user/${userId}/delete`, {
        method: 'POST'
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            location.reload();
        } else {
            alert('Error deleting user: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('Error deleting user');
    });
}

function closeModal() {
    document.getElementById('confirmModal').close();
}
</script>
{% endblock %}
