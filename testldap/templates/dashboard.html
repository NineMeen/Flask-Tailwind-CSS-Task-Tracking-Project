<!-- templates/dashboard.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="text-xl font-semibold text-gray-800">
                    ระบบจัดการข้อมูล
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-gray-600">ยินดีต้อนรับ, {{ user_data.get('displayName', session['username']) }}</span>
                    <a href="{{ url_for('logout') }}"
                        class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                        ออกจากระบบ
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8">
        <div class="bg-white shadow-md rounded-lg p-6">
            <h2 class="text-2xl font-bold mb-6">ข้อมูลผู้ใช้</h2>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="border-b py-2">
                    <span class="font-semibold">ชื่อผู้ใช้:</span>
                    <span class="ml-2">{{ session['username'] }}</span>
                </div>
                
                <div class="border-b py-2">
                    <span class="font-semibold">ชื่อ-นามสกุล:</span>
                    <span class="ml-2">{{ user_data.get('displayName', '-') }}</span>
                </div>
                
                <div class="border-b py-2">
                    <span class="font-semibold">อีเมล:</span>
                    <span class="ml-2">{{ user_data.get('email', '-') }}</span>
                </div>
                
                <div class="border-b py-2">
                    <span class="font-semibold">แผนก:</span>
                    <span class="ml-2">{{ user_data.get('memberOf', '-') }}</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
